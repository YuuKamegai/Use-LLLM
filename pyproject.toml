[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "use-lllm-webui"
version = "0.1.0"
description = "Local Ollama and ms-data-parser MCP general chat WebUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp>=1.27,<2",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
use-lllm = "use_lllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
use_lllm = ["static/vendor/*", "general/static/*"]
